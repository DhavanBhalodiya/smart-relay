[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-delegation-server"
version = "0.2.0"
description = "MCP server for delegating tasks across LLM backends and benchmarking their outputs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.3.0",
    "anthropic>=0.40.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
smartrelay = "mcp_delegation_server.server:main"
mcp-delegation-server = "mcp_delegation_server.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_delegation_server*"]
