runners:
  # ==========================================
  # NVIDIA NIM / API Catalog (build.nvidia.com)
  # ==========================================
  nemotron-3-super-120b-a12b:
    type: "nvidia"
    model: "nvidia/nemotron-3-super-120b-a12b"
    api_key_env: "NVIDIA_API_KEY"
    cost_per_million_input_tokens: 0.70
    cost_per_million_output_tokens: 0.90
    default_params:
      max_tokens: 16384
      temperature: 1

  nvidia-llama-3.3-70b:
    type: "nvidia"
    model: "meta/llama-3.3-70b-instruct"
    api_key_env: "NVIDIA_API_KEY"
    cost_per_million_input_tokens: 0.70
    cost_per_million_output_tokens: 0.90
    default_params:
      max_tokens: 4096
      temperature: 0.1

  nvidia-qwen-coder:
    type: "nvidia"
    model: "qwen/qwen2.5-coder-32b-instruct"
    api_key_env: "NVIDIA_API_KEY"
    cost_per_million_input_tokens: 0.50
    cost_per_million_output_tokens: 0.70
    default_params:
      max_tokens: 2048
      temperature: 0.2

  nvidia-deepseek-r1:
    type: "nvidia"
    model: "deepseek-ai/deepseek-r1"
    api_key_env: "NVIDIA_API_KEY"
    cost_per_million_input_tokens: 0.55
    cost_per_million_output_tokens: 2.19
    default_params:
      max_tokens: 2048
      temperature: 0.6

  nvidia-nemotron:
    type: "nvidia"
    model: "nvidia/llama-3.1-nemotron-70b-instruct"
    api_key_env: "NVIDIA_API_KEY"
    cost_per_million_input_tokens: 0.70
    cost_per_million_output_tokens: 0.90
    default_params:
      max_tokens: 2048
      temperature: 0.6
