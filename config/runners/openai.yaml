runners:
  # ==========================================
  # OpenAI Direct API
  # ==========================================
  gpt-4o:
    type: "openai"
    model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    cost_per_million_input_tokens: 2.50
    cost_per_million_output_tokens: 10.00
    default_params:
      max_tokens: 2048
      temperature: 0.7

  gpt-4o-mini:
    type: "openai"
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
    cost_per_million_input_tokens: 0.15
    cost_per_million_output_tokens: 0.60
    default_params:
      max_tokens: 2048
      temperature: 0.7
