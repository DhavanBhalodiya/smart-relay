runners:
  # ==========================================
  # Specialized Role-Based Agents
  # ==========================================
  planner-agent:
    type: "openrouter"
    model: "openai/gpt-5.6-luna"
    api_key_env: "OPENROUTER_API_KEY"
    cost_per_million_input_tokens: 3.00
    cost_per_million_output_tokens: 15.00
    default_params:
      max_tokens: 4096
      temperature: 0.2
      system_prompt_file: "prompts/planner.md"

  code-review-agent:
    type: "nvidia"
    model: "nvidia/nemotron-3-super-120b-a12b"
    api_key_env: "NVIDIA_API_KEY"
    cost_per_million_input_tokens: 0.70
    cost_per_million_output_tokens: 0.90
    timeout_seconds: 120.0
    default_params:
      max_tokens: 16384
      temperature: 0.1
      system_prompt_file: "prompts/code_review.md"

  test-generator-agent:
    type: "nvidia"
    model: "nvidia/nemotron-3-super-120b-a12b"
    api_key_env: "NVIDIA_API_KEY"
    cost_per_million_input_tokens: 0.70
    cost_per_million_output_tokens: 0.90
    default_params:
      max_tokens: 4096
      temperature: 0.2
      system_prompt_file: "prompts/test_generator.md"

  explain-agent:
    type: "openrouter"
    model: "deepseek/deepseek-v4-flash-0731"
    api_key_env: "OPENROUTER_API_KEY"
    cost_per_million_input_tokens: 0.70
    cost_per_million_output_tokens: 0.90
    default_params:
      max_tokens: 4096
      temperature: 0.3
      system_prompt_file: "prompts/explain_code.md"

  security-agent:
    type: "nvidia"
    model: "nvidia/nemotron-3-super-120b-a12b"
    api_key_env: "NVIDIA_API_KEY"
    cost_per_million_input_tokens: 0.70
    cost_per_million_output_tokens: 0.90
    timeout_seconds: 120.0
    default_params:
      max_tokens: 16384
      temperature: 0.1
      system_prompt_file: "prompts/security_audit.md"
